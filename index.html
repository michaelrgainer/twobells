<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090b">
<meta name="description" content="A meditation timer: two bells, an unwinding ring, and a one-line practice log.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='none' stroke='%23f0b429' stroke-width='3'/></svg>">
<!-- Standalone: added to the page for static hosting. Add to Home Screen works
     from here; the artifact copy omits this block because its host supplies it. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<title>Two Bells</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
  :root {
    --ground:    #08090b;
    --ring:      #f0b429;
    --ring-dim:  #6b5220;
    --ring-soft: #d69f3e;
    --track:     #191c21;
    --text:      #ece5d8;
    --muted:     #a7b0bd;
    --rose:      #d98878;
    --hairline:  #14171c;

    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Committed to one visual world: a timer used in a dark room. Every colour is
     painted explicitly so the page holds on whatever ground the viewer paints. */
  body {
    background: var(--ground);
    color: var(--text);
    font-family: var(--ui);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    -webkit-font-smoothing: antialiased;
  }

  .sit {
    /* An app surface, not a document. Dragging a ring on a desktop otherwise
       starts a text selection and hauls the legend around with the pointer. */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    width: 100%;
    max-width: 380px;
  }

  .wordmark {
    font-family: var(--display);
    font-size: 46px;
    font-weight: 400;
    letter-spacing: 0.10em;
    color: var(--muted);
    transition: opacity 700ms ease;
  }

  .voices {
    display: flex;
    gap: 8px;
    transition: opacity 700ms ease;
  }

  .voice {
    font-family: var(--ui);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    padding: 12px 18px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 160ms ease, border-color 160ms ease;
  }

  .voice:hover { color: var(--text); border-color: var(--ring-dim); }

  .voice[aria-pressed="true"] {
    color: var(--ring);
    border-color: var(--ring-dim);
  }

  .tune {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    padding: 18px 16px;
    border: 1px solid var(--hairline);
    border-radius: 14px;
  }

  .tune[hidden] { display: none; }

  .timbres {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .timbre {
    font-family: var(--ui);
    font-size: 15px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 160ms ease, border-color 160ms ease;
  }

  .timbre:hover { color: var(--text); border-color: var(--ring-dim); }
  .timbre[aria-pressed="true"] { color: var(--ring); border-color: var(--ring-dim); }

  .tune-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }

  .tune-row .slider { grid-column: 1 / -1; }

  .tune-value {
    font-size: 18px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  /* ── the legend ────────────────────────────────────────────────────────── */

  /* The rings are the control now, so this is a readout, not an input. Each value
     is tinted to match the ring it belongs to. */
  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 20px;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    transition: opacity 700ms ease;
  }

  /* Anchored on the number rather than a native <select>: Android Chrome renders
     one as a full-screen dialog, which is a lot of ceremony for picking 20. This
     covers the number and a couple of values either side of it, and nothing else. */
  .pick-wrap { position: relative; display: inline-block; }

  .pick {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    border: none;
    border-bottom: 1px dotted currentColor;
    border-radius: 0;
    padding: 2px 0 1px;
    margin-left: 6px;
    font-family: inherit;
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0.02em;
    /* Inherits the legend's caps rather than overriding them: a lowercase unit
       beside SETTLE and MEDITATE reads as a different kind of word. */
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    color: inherit;
    cursor: pointer;
  }

  .leg-settle .pick { color: var(--ring-soft); }
  .leg-meditate .pick { color: var(--ring); }

  .picker {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    width: 124px;
    height: 220px;
    border-radius: 14px;
    border: 1px solid var(--ring-dim);
    background: #0e1116;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.65);
    overflow: hidden;
  }

  .picker[hidden] { display: none; }

  .picker-list {
    height: 100%;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    /* Two rows of padding so the first and last values can still reach the
       middle of the window. */
    padding: 88px 0;
  }

  .picker-list::-webkit-scrollbar { display: none; }

  .picker-item {
    height: 44px;
    line-height: 44px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    scroll-snap-align: center;
    cursor: pointer;
  }

  .picker-item[aria-selected="true"] { color: var(--text); font-weight: 500; }

  /* Shown only when there is actually more in that direction, so the fade means
     "keep going" rather than being decoration that is always on. */
  .fade {
    position: absolute;
    left: 0;
    right: 0;
    height: 58px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 200ms ease;
  }

  .fade-top { top: 0; background: linear-gradient(to bottom, #0e1116, transparent); }
  .fade-bottom { bottom: 0; background: linear-gradient(to top, #0e1116, transparent); }
  .picker.can-up .fade-top { opacity: 1; }
  .picker.can-down .fade-bottom { opacity: 1; }

  .dial-label {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Kept for the keyboard and for screen readers: the rings are pointer-only, and
     a control you can only reach with a pointer is a control some people cannot
     reach at all. */
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  .slider {
    grid-column: 1 / -1;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 26px;
    background: transparent;
    cursor: pointer;
  }

  .slider::-webkit-slider-runnable-track {
    height: 2px;
    background: var(--track);
  }
  .slider::-moz-range-track { height: 2px; background: var(--track); }

  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    margin-top: -9px;
    border-radius: 50%;
    background: var(--ring);
    border: none;
  }
  .slider::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--ring); border: none;
  }

  /* ── the ring ──────────────────────────────────────────────────────────── */

  .ring-wrap {
    position: relative;
    width: min(78vw, 300px);
    aspect-ratio: 1;
    /* On the HTML box as well as the <svg>. Browsers apply touch-action reliably
       to an HTML element; on an SVG element it has been ignored, and when it is,
       the browser claims the gesture as a scroll and cancels the pointer sequence
       before a single move is delivered -- a drag that does nothing at all. */
    touch-action: none;
  }

  .ring-wrap svg { display: block; width: 100%; height: 100%; }

  /* `pointer-events: all` hit-tests regardless of whether the browser considers a
     fully transparent fill to be painted -- the default `visiblePainted` leaves
     that to interpretation, and mobile engines have differed. */
  .ring-hit { fill: transparent; pointer-events: all; }

  .ring-track { fill: none; stroke: var(--track); stroke-width: 6; }

  .ring-arc { fill: none; stroke-width: 6; stroke-linecap: round; }

  .arc-meditate { stroke: var(--ring); }
  .arc-settle { stroke: var(--ring-soft); }

  #rings { touch-action: none; cursor: grab; }
  #rings:active { cursor: grabbing; }

  /* The tip you grab. Hidden once a sit is running -- the durations are settled by
     then, and a handle that looks draggable but is not is a lie. */
  .handle { stroke: var(--ground); stroke-width: 2; }
  .handle-meditate { fill: var(--ring); }
  .handle-settle { fill: var(--ring-soft); }

  /* Once the first bell has rung the settle ring has nothing left to say, so it
     goes rather than sitting there empty. The duration here is only a fallback:
     it is set from JS to the bell's own decay, so the ring and the sound die
     together. (prefers-reduced-motion still collapses it -- an !important in a
     stylesheet beats an inline declaration.) */
  .track-settle, .arc-settle { transition: opacity 5s linear; }
  .sit[data-phase="sitting"] .track-settle,
  .sit[data-phase="sitting"] .arc-settle { opacity: 0; }

  /* A ring you can drag looks exactly like a ring you cannot, so the tips breathe
     until the gesture has been used once -- then the flag in localStorage stops it
     for good. A timer for sitting still has no business pulsing at someone
     forever; it only has to teach the thing once. */
  .halo {
    fill: none;
    stroke-width: 2;
    pointer-events: none;
    transform-box: fill-box;
    transform-origin: center;
    animation: grip-pulse 2.6s ease-out infinite;
  }

  .halo-meditate { stroke: var(--ring); }
  .halo-settle { stroke: var(--ring-soft); }

  @keyframes grip-pulse {
    0%   { transform: scale(1);   opacity: 0.55; }
    70%  { transform: scale(2.8); opacity: 0; }
    100% { transform: scale(2.8); opacity: 0; }
  }

  .sit.learned .halo,
  .sit:not([data-phase="idle"]) .halo { display: none; }

  /* The settle grip goes when the sit starts -- that duration is spent. The
     meditate grip stays, because dragging it in is how you cut a sit short
     without abandoning it. */
  .sit:not([data-phase="idle"]) .handle-settle { opacity: 0; }
  .sit[data-phase="waiting"] .handle-meditate { opacity: 0; }

  /* This sits on top of the whole ring area. Without pointer-events: none it eats
     every press before the rings see one -- which is why tapping and dragging did
     nothing on a phone, and why a desktop press fell through to the page and
     started a text selection instead. The note is for reading, not for pressing. */
  .ring-centre {
    pointer-events: none;
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 0 16%;
  }

  .ring-note {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 33px;
    line-height: 1.4;
    color: var(--muted);
    transition: opacity 600ms ease;
  }

  /* ── controls and log ──────────────────────────────────────────────────── */

  .controls { display: flex; gap: 14px; }

  .btn {
    font-family: var(--ui);
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 17px 44px;
    border-radius: 999px;
    border: 1px solid var(--ring);
    background: transparent;
    color: var(--ring);
    cursor: pointer;
    transition: background 200ms ease, color 200ms ease;
  }

  .btn:hover { background: var(--ring); color: var(--ground); }

  .btn-cancel { border-color: var(--hairline); color: var(--muted); }
  .btn-cancel:hover { background: transparent; border-color: var(--rose); color: var(--rose); }

  .btn[hidden] { display: none; }

  .log {
    transition: opacity 700ms ease;
    font-family: var(--display);
    font-size: 24px;
    font-weight: 400;
    color: var(--muted);
    text-align: center;
    min-height: 1.4em;
    font-variant-numeric: tabular-nums;
  }

  .log em { font-style: italic; color: var(--rose); }
  .log b { font-weight: 400; color: var(--text); }

  /* Once a sit is running, nothing else on the page can do anything, so nothing
     else on the page is there. All the way to zero rather than dimmed: a ghost of
     a control still reads as something you might be able to use. */
  .sit:not([data-phase="idle"]) .legend,
  .sit:not([data-phase="idle"]) .tune,
  .sit:not([data-phase="idle"]) .voices,
  .sit:not([data-phase="idle"]) .log,
  .sit:not([data-phase="idle"]) .wordmark { opacity: 0; pointer-events: none; }

  :focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; }
    .halo { animation: none; opacity: 0.5; }
  }
</style>

<main class="sit" id="sit" data-phase="idle">
  <div class="wordmark">Two Bells</div>

  <div class="voices" id="voices" role="group" aria-label="Bell sound"></div>

  <div class="tune" id="tune" hidden></div>

  <div class="legend" id="legend">
    <span class="leg-settle">Settle<span class="pick-wrap">
      <button type="button" class="pick" id="pick-first" aria-haspopup="listbox"
              aria-expanded="false" aria-label="Settle, seconds">10s</button>
      <div class="picker" id="picker-first" hidden>
        <div class="picker-list" id="list-first" role="listbox"></div>
        <div class="fade fade-top"></div><div class="fade fade-bottom"></div>
      </div></span></span>
    <span class="leg-meditate">Meditate<span class="pick-wrap">
      <button type="button" class="pick" id="pick-sit" aria-haspopup="listbox"
              aria-expanded="false" aria-label="Meditate, minutes">20min</button>
      <div class="picker" id="picker-sit" hidden>
        <div class="picker-list" id="list-sit" role="listbox"></div>
        <div class="fade fade-top"></div><div class="fade fade-bottom"></div>
      </div></span></span>
  </div>

  <!-- Full range on both rings. The two ends of a ring sit next to each other at
       twelve o'clock while being a whole turn apart in duration, but the drag
       handler treats a move of more than half a turn as a crossing and stops at
       the boundary, so neither end can be reached by accident from the other.
       0 is a sensible settle (begin at once) and never a sensible sit, so the
       floors differ. -->
  <input class="sr" type="range" id="rng-first" min="0" max="59" step="1" value="10"
         tabindex="-1" aria-hidden="true">
  <input class="sr" type="range" id="rng-sit" min="1" max="60" step="1" value="20"
         tabindex="-1" aria-hidden="true">

  <div class="ring-wrap">
    <svg viewBox="0 0 200 200" id="rings" aria-hidden="true">
      <!-- An SVG hit-tests rendered content only, and the tracks and arcs are
           `fill: none`, so without this the sole pointer targets were their 6px
           strokes: unhittable on a phone, and on a desktop the miss fell through
           to the page as a text selection. `transparent` takes pointer events
           where `none` does not. -->
      <circle class="ring-hit" cx="100" cy="100" r="100"></circle>
      <circle class="ring-track track-meditate" cx="100" cy="100" r="90"></circle>
      <circle class="ring-track track-settle" cx="100" cy="100" r="66"></circle>
      <circle class="ring-arc arc-meditate" id="arc-sit" cx="100" cy="100" r="90"
              transform="rotate(-90 100 100)"></circle>
      <circle class="ring-arc arc-settle" id="arc-first" cx="100" cy="100" r="66"
              transform="rotate(-90 100 100)"></circle>
      <circle class="halo halo-meditate" id="halo-sit" r="8"></circle>
      <circle class="halo halo-settle" id="halo-first" r="8"></circle>
      <circle class="handle handle-meditate" id="grip-sit" r="8"></circle>
      <circle class="handle handle-settle" id="grip-first" r="8"></circle>
    </svg>
    <div class="ring-centre">
      <div class="ring-note" id="note">Settle<br>then begin</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="start">Begin</button>
    <button class="btn btn-cancel" id="cancel" hidden>End early</button>
  </div>

  <div class="log" id="log" aria-live="polite">No sits recorded yet</div>

  <div class="log-tools">
    <span class="pick-wrap" id="prune" hidden>
    <button type="button" class="prune" id="pick-keep" aria-haspopup="listbox"
            aria-expanded="false">Keep last&hellip;</button>
    <div class="picker" id="picker-keep" hidden>
      <div class="picker-list" id="list-keep" role="listbox"></div>
      <div class="fade fade-top"></div><div class="fade fade-bottom"></div>
      </div>
    </span>

    <!-- Turns up once the practice has: ten sits in, someone is using this, and a
         way to say so costs one line. -->
    <a class="prune" id="contact" hidden
       href="mailto:michael.r.gainer@gmail.com?subject=Two%20Bells">Contact</a>
  </div>
</main>

<script>
(() => {
  "use strict";

  const el = {
    sit: document.getElementById("sit"),
    rings: document.getElementById("rings"),
    arcFirst: document.getElementById("arc-first"),
    trackSettle: document.querySelector(".track-settle"),
    arcSit: document.getElementById("arc-sit"),
    gripFirst: document.getElementById("grip-first"),
    gripSit: document.getElementById("grip-sit"),
    haloFirst: document.getElementById("halo-first"),
    haloSit: document.getElementById("halo-sit"),
    note: document.getElementById("note"),
    start: document.getElementById("start"),
    cancel: document.getElementById("cancel"),
    log: document.getElementById("log"),
    voices: document.getElementById("voices"),
    tune: document.getElementById("tune"),
    rngFirst: document.getElementById("rng-first"),
    rngSit: document.getElementById("rng-sit"),
    pickFirst: document.getElementById("pick-first"),
    pickSit: document.getElementById("pick-sit"),
    pickerFirst: document.getElementById("picker-first"),
    pickerSit: document.getElementById("picker-sit"),
    listFirst: document.getElementById("list-first"),
    listSit: document.getElementById("list-sit"),
    prune: document.getElementById("prune"),
    contact: document.getElementById("contact"),
    pickKeep: document.getElementById("pick-keep"),
    pickerKeep: document.getElementById("picker-keep"),
    listKeep: document.getElementById("list-keep"),
  };

  // Sixty units fill a ring, whether they are seconds of settling or minutes of
  // sitting, so both rings read on one absolute scale: 45s of settle and 45min of
  // sit both stand at three quarters, and the tip travels one sixtieth of a turn
  // per unit on either. The two radii are the two dials.
  const RING_UNITS = 60;
  const DIALS = [
    { key: "sit",   radius: 90, arc: "arcSit",   grip: "gripSit",
      halo: "haloSit",   range: "rngSit" },
    { key: "first", radius: 66, arc: "arcFirst", grip: "gripFirst",
      halo: "haloFirst", range: "rngFirst" },
  ];

  DIALS.forEach((dial) => {
    dial.circumference = 2 * Math.PI * dial.radius;
    el[dial.arc].style.strokeDasharray = String(dial.circumference);
  });

  function setSettleFade(duration) {
    el.arcFirst.style.transitionDuration = duration;
    el.trackSettle.style.transitionDuration = duration;
  }

  function paintDial(dial, units) {
    const fraction = Math.max(0, Math.min(1, units / RING_UNITS));
    // Unwinds counterclockwise: the arc is drawn clockwise from twelve, so a
    // growing offset retreats its leading edge back the other way.
    el[dial.arc].style.strokeDashoffset =
      String(dial.circumference * (1 - fraction));
    // The grip sits on that leading edge -- it IS the tip of the arc, which is
    // what makes it obvious that dragging it is what sets the duration.
    const angle = (-90 + fraction * 360) * Math.PI / 180;
    const x = String(100 + dial.radius * Math.cos(angle));
    const y = String(100 + dial.radius * Math.sin(angle));
    el[dial.grip].setAttribute("cx", x);
    el[dial.grip].setAttribute("cy", y);
    el[dial.halo].setAttribute("cx", x);
    el[dial.halo].setAttribute("cy", y);
  }

  // ── the bell ────────────────────────────────────────────────────────────
  // Synthesised rather than fetched: an audio file would be a network request
  // the page's own CSP forbids, and a struck bowl is a handful of inharmonic
  // partials over a long decay, which is cheaper to generate than to store.
  let audio = null;

  function unlockAudio() {
    if (!audio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audio = new Ctx();
    }
    if (audio.state === "suspended") audio.resume();
  }

  // Four voices, each a set of partials over a decay. What separates them is
  // inharmonicity and length: a bowl's partials sit at unmusical ratios and ring
  // for six seconds; a glass bell is near-harmonic, high, and gone in two.
  // Both dropped voices had partials at 1, 2, 3, 4 -- a harmonic series, which is
  // what a struck STRING produces. That is why they read as piano. What is left is
  // inharmonic, which is what struck metal does, and Custom stays in that territory.
  const PRESETS = [
    { id: "bowl",  label: "Bowl",  first: 210, close: 150, decay: 8.0,
      damping: 0.95, detune: 0.0035, strike: 0.20, bright: 1,
      partials: [[1, 0.50], [2.68, 0.20], [5.15, 0.09], [8.40, 0.04]] },
    { id: "chime", label: "Chime", first: 440, close: 330, decay: 6.0,
      damping: 1.05, detune: 0.0012, strike: 0.26, bright: 1,
      partials: [[1, 0.38], [2.76, 0.16], [5.40, 0.07], [8.93, 0.03]] },
  ];

  // Four macros, each moving several parameters together. Sliders on the raw
  // partial ratios would be a synth toy: most of that space is atonal, and none
  // of it is what anyone wants at the start of a sit.
  const MACROS = [
    { key: "pitch",   label: "Pitch",      min: 110, max: 660, step: 5,   unit: "Hz" },
    { key: "ring",    label: "Ring",       min: 2,   max: 14,  step: 0.5, unit: "s" },
    { key: "bright",  label: "Brightness", min: 0,   max: 100, step: 1,   unit: "" },
    { key: "shimmer", label: "Shimmer",    min: 0,   max: 100, step: 1,   unit: "" },
  ];

  // Bodies, not a blend of two of them. Interpolating partial ratios walks a
  // straight line through ratios no physical object has -- 1 : 2.34 : 4.08 is not
  // halfway between a bowl and a string, it is a thing that does not exist, and it
  // sounds like it. Each of these is one real instrument's mode series.
  //
  // Confidence varies. The church bell (hum, prime, tierce, quint, nominal) and
  // the free-free bar the tubular bell uses are textbook. Vibraphone and marimba
  // bars are tuned to the cited 1:4:10 and 1:4:9.2. Bowl and glass vary a lot by
  // object, so those two are representative rather than definitive.
  const TIMBRES = [
    { id: "bowl",    label: "Bowl",      damping: 0.95,
      partials: [[1, 0.50], [2.68, 0.20], [5.15, 0.09], [8.40, 0.04]] },
    { id: "tubular", label: "Tubular",   damping: 1.05,
      partials: [[1, 0.38], [2.76, 0.16], [5.40, 0.07], [8.93, 0.03]] },
    { id: "church",  label: "Church",    damping: 1.10,
      partials: [[0.5, 0.30], [1, 0.40], [1.2, 0.22], [1.5, 0.14], [2, 0.10]] },
    { id: "handpan", label: "Handpan",   damping: 1.15,
      partials: [[1, 0.45], [2, 0.22], [3, 0.10]] },
    // Vibraphone was here at 1:4:10 and was indistinguishable from this: the two
    // instruments differ by material and resonators, which none of this models.
    // Marimba is the one worth keeping -- it is the only body in the set that is
    // not metal or glass, so it earns its place by contrast. Wood damps hard and
    // its identity is mostly in the thump of mallet on bar, hence the low, loud
    // transient and the steep damping.
    { id: "marimba", label: "Marimba",   damping: 2.10, hit: 1.9, hitBand: 3.0,
      partials: [[1, 0.50], [4, 0.14], [9.2, 0.04]] },
    { id: "glass",   label: "Glass",     damping: 1.40,
      partials: [[1, 0.42], [2.32, 0.08], [4.20, 0.03]] },
    { id: "string",  label: "String",    damping: 1.30,
      partials: [[1, 0.44], [2, 0.20], [3, 0.11], [4, 0.06], [5, 0.03]] },
  ];

  const CUSTOM_KEY = "two-bells:custom";
  let custom = { pitch: 330, ring: 10, bright: 60, shimmer: 20, timbre: "church" };

  function customVoice() {
    const b = custom.bright / 100;
    const body = TIMBRES.find((t) => t.id === custom.timbre) || TIMBRES[0];
    return {
      id: "custom", label: "Custom",
      first: custom.pitch,
      close: Math.round(custom.pitch * 0.71),   // a fifth down, as the presets are
      decay: custom.ring,
      // The body sets the relative decay rates; Brightness leans on them.
      damping: body.damping - b * 0.35,
      detune: (custom.shimmer / 100) * 0.006,
      strike: (0.14 + b * 0.30) * (body.hit || 1),
      hitBand: body.hitBand || 7,
      bright: 0.55 + b * 0.9,
      // The body's own ratios, with Brightness scaling everything above the
      // fundamental. The fundamental itself is left alone so the pitch holds.
      partials: body.partials.map(([ratio, level], i) =>
        [ratio, i === 0 ? level : level * (0.35 + b * 1.3)]),
    };
  }

  const VOICES = PRESETS.concat([customVoice()]);

  const VOICE_KEY = "two-bells:voice";
  let voice = VOICES[0];

  let noiseBuffer = null;

  function makeNoise() {
    // One buffer, reused: the strike transient is the same shaped noise every
    // time, only filtered differently per voice.
    const frames = Math.floor(audio.sampleRate * 0.25);
    const buffer = audio.createBuffer(1, frames, audio.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  function strike(which) {
    if (!audio) return;
    const now = audio.currentTime;
    const root = which === "close" ? voice.close : voice.first;
    const length = which === "close" ? voice.decay * 1.4 : voice.decay;

    // A brightness envelope over the whole strike. The top end belongs to the
    // moment of impact, not to the ring that follows it.
    const bus = audio.createGain();
    const tone = audio.createBiquadFilter();
    tone.type = "lowpass";
    tone.Q.value = 0.7;
    tone.frequency.setValueAtTime(root * 14 * voice.bright, now);
    tone.frequency.exponentialRampToValueAtTime(root * 2.6 * voice.bright, now + 1.1);
    bus.connect(tone).connect(audio.destination);

    voice.partials.forEach(([ratio, level], index) => {
      // Higher partials die first, by `damping`.
      const life = Math.max(0.12, length * Math.pow(ratio, -voice.damping));
      // The pair, a few cents apart, beating slowly against each other.
      [-1, 1].forEach((side) => {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = "sine";
        osc.frequency.value = root * ratio * (1 + side * voice.detune * 0.5);
        gain.gain.setValueAtTime(0, now);
        // Higher partials speak a hair later, as they do on a real strike.
        gain.gain.linearRampToValueAtTime(level * 0.5, now + 0.004 + index * 0.0015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + life);
        osc.connect(gain).connect(bus);
        osc.start(now);
        osc.stop(now + life + 0.05);
      });
    });

    // The strike itself: a short band of noise at the moment of contact. Without
    // it the tone fades up rather than being struck, which is most of why the
    // first attempt sounded synthetic.
    if (!noiseBuffer) noiseBuffer = makeNoise();
    const hit = audio.createBufferSource();
    const band = audio.createBiquadFilter();
    const hitGain = audio.createGain();
    hit.buffer = noiseBuffer;
    band.type = "bandpass";
    band.frequency.value = root * (voice.hitBand || 7);
    band.Q.value = 1.2;
    hitGain.gain.setValueAtTime(voice.strike * 0.25, now);
    hitGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    hit.connect(band).connect(hitGain).connect(bus);
    hit.start(now);
    hit.stop(now + 0.25);
  }

  // Two concerns kept apart: applying a voice, and the gesture of picking one.
  // Restoring a saved choice on load must not fling the tuning panel open.
  function applyVoice(id) {
    voice = id === "custom" ? customVoice()
                            : (PRESETS.find((v) => v.id === id) || PRESETS[0]);
    try { localStorage.setItem(VOICE_KEY, voice.id); } catch (_) {}
    el.voices.querySelectorAll(".voice").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.voice === voice.id));
    });
  }

  // The panel is tall enough to push the rings off a phone screen, so it does not
  // rely on being dismissed: any stretch of not touching it puts it away again.
  const PANEL_IDLE_MS = 10000;
  let panelTimer = null;

  function closePanel() {
    el.tune.hidden = true;
    clearTimeout(panelTimer);
    panelTimer = null;
  }

  function openPanel() {
    el.tune.hidden = false;
    keepPanelOpen();
  }

  function keepPanelOpen() {
    clearTimeout(panelTimer);
    panelTimer = setTimeout(closePanel, PANEL_IDLE_MS);
  }

  function chooseVoice(id) {
    // Custom toggles its own panel, and a second tap is a request to put the panel
    // away rather than to hear the bell again -- by then it has just been heard
    // from a slider or a body button.
    if (id === "custom" && voice.id === "custom" && !el.tune.hidden) {
      closePanel();
      return;
    }
    applyVoice(id);
    if (id === "custom") openPanel(); else closePanel();
    unlockAudio();
    strike("first");
  }

  function buildVoices() {
    VOICES.forEach((v) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "voice";
      button.dataset.voice = v.id;
      button.textContent = v.label;
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => chooseVoice(v.id));
      el.voices.appendChild(button);
    });

    try {
      const saved = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "null");
      if (saved) custom = Object.assign(custom, saved);
    } catch (_) {}

    let start = PRESETS[0].id;
    try {
      const savedId = localStorage.getItem(VOICE_KEY);
      if (VOICES.some((v) => v.id === savedId)) start = savedId;
    } catch (_) {}
    applyVoice(start);
  }

  function buildTune() {
    // The body first, then the shaping: picking an instrument is a different kind
    // of choice from nudging its brightness, so it gets a different control.
    const bodyRow = document.createElement("div");
    bodyRow.className = "tune-row";
    const bodyLabel = document.createElement("span");
    bodyLabel.className = "dial-label";
    bodyLabel.textContent = "Body";
    const picker = document.createElement("div");
    picker.className = "timbres";
    picker.setAttribute("role", "group");
    picker.setAttribute("aria-label", "Body");

    TIMBRES.forEach((body) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "timbre";
      button.dataset.timbre = body.id;
      button.textContent = body.label;
      button.setAttribute("aria-pressed", String(body.id === custom.timbre));
      button.addEventListener("click", () => {
        custom.timbre = body.id;
        picker.querySelectorAll(".timbre").forEach((other) => {
          other.setAttribute("aria-pressed", String(other.dataset.timbre === body.id));
        });
        voice = customVoice();
        try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom)); } catch (_) {}
        keepPanelOpen();
        unlockAudio();
        strike("first");
      });
      picker.appendChild(button);
    });

    bodyRow.append(bodyLabel, picker);
    bodyRow.querySelector(".timbres").style.gridColumn = "1 / -1";
    el.tune.appendChild(bodyRow);

    MACROS.forEach((macro) => {
      const row = document.createElement("div");
      row.className = "tune-row";

      const label = document.createElement("span");
      label.className = "dial-label";
      label.textContent = macro.label;

      const value = document.createElement("span");
      value.className = "tune-value";

      const range = document.createElement("input");
      range.className = "slider";
      range.type = "range";
      range.min = String(macro.min);
      range.max = String(macro.max);
      range.step = String(macro.step);
      range.value = String(custom[macro.key]);
      range.setAttribute("aria-label", macro.label);

      const show = () => {
        value.textContent = custom[macro.key] + (macro.unit ? " " + macro.unit : "");
      };
      show();

      range.addEventListener("input", () => {
        custom[macro.key] = Number(range.value);
        show();
        voice = customVoice();
        try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom)); } catch (_) {}
        keepPanelOpen();
      });

      // Struck on release, not on every step of the drag: `input` fires per pixel
      // and would stack a hundred overlapping bells.
      range.addEventListener("change", () => {
        keepPanelOpen();
        unlockAudio();
        strike("first");
      });

      row.append(label, value, range);
      el.tune.appendChild(row);
    });
  }

  // ── keeping the screen alive ────────────────────────────────────────────
  // A phone that sleeps mid-sit stops the animation frame and can throttle the
  // timer, so the closing bell arrives late or not at all. The wake lock is the
  // reliable fix; the elapsed-time check on resume is the fallback for when it
  // is unavailable or dropped.
  let wakeLock = null;

  async function holdScreen() {
    try {
      if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    } catch (_) { /* unsupported or refused; the resume check covers it */ }
  }

  function releaseScreen() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  // ── the session ─────────────────────────────────────────────────────────
  let session = null;
  let frame = null;
  const backstops = [];

  function settings() {
    return { first: Number(el.rngFirst.value), sit: Number(el.rngSit.value) };
  }

  // Coarse by 5s in the list, exact on the ring.
  const ITEM_HEIGHT = 44;
  const PICKERS = [
    { button: "pickFirst", panel: "pickerFirst", list: "listFirst",
      grid: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55],
      label: (v) => v + " sec",
      get: () => Number(el.rngFirst.value),
      set: (v) => { el.rngFirst.value = String(v); renderDials(); } },
    { button: "pickSit", panel: "pickerSit", list: "listSit",
      grid: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60],
      label: (v) => v + " min",
      get: () => Number(el.rngSit.value),
      set: (v) => { el.rngSit.value = String(v); renderDials(); } },
    { button: "pickKeep", panel: "pickerKeep", list: "listKeep",
      grid: [5, 10, 20, 50, 100],
      label: (v) => "keep " + v,
      get: () => history.length,
      // Only counts that would actually discard something. Offering "keep 20" for
      // a log of nine is a menu of things that do nothing.
      values: () => [1, 3, 5, 10, 20, 50, 100].filter((n) => n < history.length),
      set: (v) => armPrune(v) },
  ];

  let openPicker = null;

  function pickerValues(picker) {
    if (picker.values) return picker.values();
    const value = picker.get();
    // A ring drag lands on values the grid does not contain; the odd one out is
    // spliced in rather than silently rounded away.
    return picker.grid.includes(value)
      ? picker.grid
      : picker.grid.concat([value]).sort((a, b) => a - b);
  }

  function updateFades(picker) {
    const list = el[picker.list];
    const panel = el[picker.panel];
    panel.classList.toggle("can-up", list.scrollTop > 2);
    panel.classList.toggle("can-down",
      list.scrollTop < list.scrollHeight - list.clientHeight - 2);
  }

  function closePicker() {
    if (!openPicker) return;
    el[openPicker.panel].hidden = true;
    el[openPicker.button].setAttribute("aria-expanded", "false");
    openPicker = null;
  }

  function choose(picker, value) {
    closePicker();
    picker.set(value);
  }

  function showPicker(picker) {
    const wasOpen = openPicker === picker;
    closePicker();
    if (wasOpen) return;                       // a second tap puts it away

    const list = el[picker.list];
    const values = pickerValues(picker);
    const current = picker.get();
    list.textContent = "";
    values.forEach((value) => {
      const item = document.createElement("div");
      item.className = "picker-item";
      item.setAttribute("role", "option");
      item.setAttribute("aria-selected", String(value === current));
      item.textContent = picker.label(value);
      item.addEventListener("click", () => choose(picker, value));
      list.appendChild(item);
    });

    el[picker.panel].hidden = false;
    el[picker.button].setAttribute("aria-expanded", "true");
    openPicker = picker;
    // The padding above the first row means this offset lands the chosen value in
    // the middle of the window, with its neighbours either side.
    list.scrollTop = values.indexOf(current) * ITEM_HEIGHT;
    updateFades(picker);
  }

  function buildPickers() {
    PICKERS.forEach((picker) => {
      el[picker.button].addEventListener("click", (event) => {
        event.stopPropagation();
        if (picker.button === "pickKeep" && pendingKeep !== null) return doPrune();
        showPicker(picker);
      });
      el[picker.list].addEventListener("scroll", () => updateFades(picker));
      el[picker.panel].addEventListener("click", (event) => event.stopPropagation());
    });

    document.addEventListener("click", () => { closePicker(); cancelPrune(); });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || !openPicker) return;
      const button = el[openPicker.button];
      closePicker();
      button.focus();
    });
  }

  function renderDials() {
    const { first, sit } = settings();
    PICKERS.slice(0, 2).forEach((picker) => {
      el[picker.button].textContent = picker.label(picker.get());
    });
    // The button names what pressing it actually starts. With settling time on the
    // clock the first thing that happens is settling, not the sit.
    el.start.textContent = first > 0 ? "Settle" : "Begin";
    if (!session) {
      paintDial(DIALS[0], sit);
      paintDial(DIALS[1], first);
    }
  }

  // ── dragging a tip ──────────────────────────────────────────────────────
  // Which ring you grabbed is decided by how far from the centre you touched, so
  // the whole annulus is a target rather than just the eight-pixel grip.
  let dragging = null;
  let sitDrag = null;
  const LEARNED_KEY = "two-bells:learned";

  function markLearned() {
    if (el.sit.classList.contains("learned")) return;
    el.sit.classList.add("learned");
    try { localStorage.setItem(LEARNED_KEY, "1"); } catch (_) {}
  }

  function ringPoint(event) {
    const box = el.rings.getBoundingClientRect();
    const scale = 200 / box.width;
    return {
      x: (event.clientX - box.left) * scale - 100,
      y: (event.clientY - box.top) * scale - 100,
    };
  }

  function nearestDial(point) {
    const distance = Math.hypot(point.x, point.y);
    // Ignore the hole in the middle: a tap there is not aimed at either ring.
    if (distance < 40 || distance > 112) return null;
    return DIALS.reduce((best, dial) =>
      Math.abs(distance - dial.radius) < Math.abs(distance - best.radius) ? dial : best);
  }

  function setFromPoint(dial, point) {
    // Clockwise from twelve, so the value grows the way the arc is drawn.
    let degrees = Math.atan2(point.y, point.x) * 180 / Math.PI + 90;
    if (degrees < 0) degrees += 360;
    const range = el[dial.range];
    const previous = Number(range.value);
    let units = Math.round(degrees / 360 * RING_UNITS);
    // Twelve o'clock is both 0 and 60. Read literally, the top of the ring means
    // zero, so 60 minutes could never be chosen and a drag across the top would
    // snap from 59 straight to 1. A move of more than half a turn is a crossing,
    // not a jump, so it stops at the boundary it was heading for.
    if (previous - units > RING_UNITS / 2) units = RING_UNITS;
    else if (units - previous > RING_UNITS / 2) units = 0;
    range.value = String(Math.max(Number(range.min), Math.min(Number(range.max), units)));
    renderDials();
  }

  // Adjusting a running sit is RELATIVE: the grab records where the pointer was and
  // how much time was left, and only movement from there changes anything. Absolute
  // was wrong and dangerous -- it set the remaining time to wherever you touched,
  // so grabbing the tip of a nearly-finished sit (whose tip sits a few degrees from
  // twelve) rounded to zero and rang the bell on contact. A tap now does nothing,
  // which is what a tap should do.
  function angleOf(point) {
    const degrees = Math.atan2(point.y, point.x) * 180 / Math.PI + 90;
    return degrees < 0 ? degrees + 360 : degrees;
  }

  function adjustSit(point) {
    let delta = angleOf(point) - sitDrag.angle;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    const shifted = sitDrag.endAt + delta / 360 * RING_UNITS * 60000;
    // Never later than where it started -- this shortens a sit, it does not edit
    // the clock -- and never earlier than now.
    session.endAt = Math.max(Date.now(), Math.min(sitDrag.endAt, shifted));
    scheduleBackstops();
    tick();
  }

  function onDragMove(event) {
    if (!dragging) return;
    const point = ringPoint(event);
    if (sitDrag) adjustSit(point);
    else setFromPoint(dragging, point);
  }

  function endDrag() {
    dragging = null;
    sitDrag = null;
    window.removeEventListener("pointermove", onDragMove);
    window.removeEventListener("pointerup", endDrag);
    window.removeEventListener("pointercancel", endDrag);
  }

  el.rings.addEventListener("pointerdown", (event) => {
    // Suppressed first, and whether or not a ring was hit: a press that lands in
    // the hole would otherwise begin a native text-selection drag.
    event.preventDefault();
    // Mid-sit, only the outer ring answers, and only to shorten.
    if (session && !session.rang) return;
    const point = ringPoint(event);
    const dial = nearestDial(point);
    if (!dial) return;
    if (session && dial !== DIALS[0]) return;
    dragging = dial;
    // Capture is an optimisation, not the mechanism. Mobile Safari has thrown on
    // setPointerCapture for SVG elements, and when it did, everything after it in
    // this handler was skipped -- so the ring never moved and the whole gesture
    // looked dead. The window listeners below do the actual work.
    try { el.rings.setPointerCapture(event.pointerId); } catch (_) {}
    window.addEventListener("pointermove", onDragMove);
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);
    markLearned();
    if (session) {
      // Nothing happens on contact; only on movement away from here.
      sitDrag = { angle: angleOf(point), endAt: session.endAt };
    } else {
      setFromPoint(dial, point);
    }
  });

  function begin() {
    unlockAudio();
    holdScreen();

    const { first, sit } = settings();
    const now = Date.now();
    session = {
      first, sit,
      startedAt: now,
      bellAt: now + first * 1000,
      endAt: now + first * 1000 + sit * 60000,
      rang: false,
    };

    el.sit.dataset.phase = first > 0 ? "waiting" : "sitting";
    el.note.textContent = first > 0 ? "Settling" : "";
    el.start.hidden = true;
    el.cancel.hidden = false;
    closePanel();

    // Absolute deadlines, not accumulated intervals, so a throttled frame loop
    // cannot make the sit drift longer than it was set for.
    scheduleBackstops();
    loop();
  }

  function scheduleBackstops() {
    // Re-armed whenever endAt moves: a shortened sit whose backstop still points
    // at the original time would ring late on a phone whose frame loop is asleep.
    while (backstops.length) clearTimeout(backstops.pop());
    const now = Date.now();
    backstops.push(setTimeout(() => tick(), Math.max(0, session.bellAt - now) + 40));
    backstops.push(setTimeout(() => tick(), Math.max(0, session.endAt - now) + 40));
  }

  function tick() {
    if (!session) return;
    const now = Date.now();

    if (!session.rang && now >= session.bellAt) {
      session.rang = true;
      strike("first");
      // The ring goes out with the bell: the fundamental rings for exactly
      // voice.decay seconds, so that is how long the settle ring takes to fade.
      setSettleFade(voice.decay + "s");
      el.sit.dataset.phase = "sitting";
      el.note.textContent = "";
    }

    if (now >= session.endAt) {
      strike("close");
      finish("complete");
      return;
    }

    if (session.rang) {
      paintDial(DIALS[1], 0);
      paintDial(DIALS[0], (session.endAt - now) / 60000);   // minutes left, of sixty
    } else {
      paintDial(DIALS[0], session.sit);                     // still to come
      paintDial(DIALS[1], (session.bellAt - now) / 1000);   // seconds left, of sixty
    }
  }

  function loop() {
    tick();
    if (session) frame = requestAnimationFrame(loop);
  }

  function finish(outcome) {
    if (!session) return;
    const elapsedMs = Date.now() - session.startedAt;
    // Both numbers, because a sit dragged short is neither the sit that was set
    // nor an abandoned one, and the log should not have to pretend it is either.
    const sat = session.rang
      ? Math.max(0, Math.round((Date.now() - session.bellAt) / 60000))
      : 0;
    const record = {
      at: new Date().toISOString(),
      first: session.first,
      sit: session.sit,
      sat,
      elapsedMs,
      outcome,
    };

    // Nothing sat, nothing to record. Walking away during the settle is changing
    // your mind about starting, and a practice log full of those is noise.
    const worthKeeping = session.rang;

    session = null;
    if (frame) cancelAnimationFrame(frame);
    while (backstops.length) clearTimeout(backstops.pop());
    releaseScreen();

    el.sit.dataset.phase = "idle";
    el.note.innerHTML = outcome === "complete" ? "Sit complete" : "Settle<br>then begin";
    el.start.hidden = false;
    el.cancel.hidden = true;
    setSettleFade("600ms");
    renderDials();

    if (worthKeeping) {
      save(record);
      history.unshift(record);
      renderLog();
    }
  }

  // ── the practice log ────────────────────────────────────────────────────
  // Kept in the artifact's own store when it is reachable, so the log follows
  // between phone and laptop and survives clearing site data; localStorage
  // holds the same record for when it is not.
  const KEY = "two-bells:log";
  const LEGACY_KEY = "two-bells:last";
  const KEEP = 200;
  let store = null;
  let history = [];

  function persistLocal() {
    try {
      localStorage.setItem(KEY, JSON.stringify(history.slice(0, KEEP)));
    } catch (_) {}
  }

  function save(record) {
    persistLocal();
    if (store) {
      store.doc("sits/" + record.at.replace(/[:.]/g, "-"))
           .set(record).catch(() => {});
    }
  }

  function describe(record) {
    const when = new Date(record.at);
    const day = when.toLocaleDateString(undefined,
      { weekday: "short", day: "numeric", month: "short" });
    const time = when.toLocaleTimeString(undefined,
      { hour: "2-digit", minute: "2-digit" });

    if (record.outcome === "complete") {
      const sat = record.sat === undefined ? record.sit : record.sat;
      const shortened = sat !== record.sit
        ? " <em>(set " + record.sit + ")</em>" : "";
      return day + " &middot; " + time + " &middot; <b>" + sat + " min</b>" + shortened;
    }
    const minutes = Math.max(0, Math.round(record.elapsedMs / 60000));
    return day + " &middot; " + time + " &middot; <em>left at " + minutes +
           " of " + record.sit + " min</em>";
  }

  // Six or more before the housekeeping appears: below that, scrolling past the
  // whole log is less work than pruning it.
  const PRUNE_FROM = 6;
  const CONTACT_FROM = 10;
  let pendingKeep = null;

  function armPrune(keep) {
    pendingKeep = keep < history.length ? keep : null;
    renderLog();
  }

  function cancelPrune() {
    if (pendingKeep === null) return;
    pendingKeep = null;
    renderLog();
  }

  function doPrune() {
    const removed = history.slice(pendingKeep);
    history = history.slice(0, pendingKeep);
    pendingKeep = null;
    persistLocal();
    // Out of the shared store too, or they return on the next device that syncs.
    if (store) {
      removed.forEach((record) => {
        store.doc("sits/" + record.at.replace(/[:.]/g, "-")).delete().catch(() => {});
      });
    }
    renderLog();
  }

  function renderPruneControl() {
    el.prune.hidden = history.length < PRUNE_FROM;
    el.contact.hidden = history.length < CONTACT_FROM;
    if (pendingKeep === null) {
      el.pickKeep.textContent = "Keep last\u2026";
      el.pickKeep.classList.remove("armed");
      return;
    }
    const going = history.length - pendingKeep;
    el.pickKeep.textContent = "Discard " + going + " older \u2014 tap to confirm";
    el.pickKeep.classList.add("armed");
  }

  function renderLog() {
    renderPruneControl();
    if (!history.length) {
      el.log.innerHTML = "No sits recorded yet";
      return;
    }
    // Sorted here rather than trusting the order it arrived in: the store, this
    // browser's copy, and a record just unshifted on all agree today, and a render
    // that depends on all three continuing to agree is one that will eventually
    // show someone their practice backwards.
    // Sorted in place, so the array's order is the order on screen -- which is
    // what makes "keep the first N" mean "keep the newest N" rather than
    // whichever N happened to be stored first.
    history.sort((a, b) => String(b.at).localeCompare(String(a.at)));
    el.log.innerHTML = history
      .map((record, i) => {
        const doomed = pendingKeep !== null && i >= pendingKeep ? " doomed" : "";
        return "<div class=\"sit-row" + doomed + "\">" + describe(record) + "</div>";
      })
      .join("");
  }

  function loadLocal() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        history = JSON.parse(raw) || [];
      } else {
        // One record under the old key, from before this kept a list.
        const legacy = localStorage.getItem(LEGACY_KEY);
        if (legacy) history = [JSON.parse(legacy)];
      }
    } catch (_) {
      history = [];
    }
    renderLog();
  }

  // ── wiring ──────────────────────────────────────────────────────────────
  el.rngFirst.addEventListener("input", renderDials);
  el.rngSit.addEventListener("input", renderDials);

  el.start.addEventListener("click", begin);
  el.cancel.addEventListener("click", () => finish("cancelled"));

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !session) return;
    holdScreen();   // a lock is dropped whenever the page is hidden
    tick();         // catch up on anything a throttled frame loop missed
  });

  try {
    if (localStorage.getItem(LEARNED_KEY)) el.sit.classList.add("learned");
  } catch (_) {}

  buildVoices();
  buildTune();
  buildPickers();
  renderDials();
  loadLocal();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then((db) => {
      if (!db) return;
      store = db;
      db.collection("sits").orderBy("at", "desc").limit(KEEP).get()
        .then((snap) => {
          if (snap.empty) return;
          // The store is the fuller record: it follows between devices, where
          // localStorage only ever remembers this one browser.
          history = snap.docs.map((doc) => doc.data());
          renderLog();
        })
        .catch(() => {});
    }).catch(() => {});
  }
})();
</script>

</body>
</html>
